backend:
  name: git-gateway
  branch: main

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "insight"
    label: "Insights"
    folder: "src/lib/_content/insights"
    create: true
    slug: "{{title}}-{{day}}-{{month}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Author", name: "author", widget: "text" }
      - { label: "Post", name: "body", widget: "markdown" }
      - { label: "Tags", name: "tags", widget: "list", required: false }
  - name: "releases"
    label: "Releases"
    folder: "src/lib/_content/releases"
    create: true
    slug: "{{artist}}-{{title}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Artist", name: "artist", widget: "string" }
      - { label: "Catalogue Number", name: "cat_no", widget: "string", hint: "e.g. REF001", required: false }
      - { label: "Release Date", name: "date", widget: "datetime" }
      - { label: "Cover Art", name: "cover_art", widget: "image"}
      - { label: "Buy/Stream Link", name: "buy_link", widget: "string"}
      - { label: "Buy/Stream Button Text", name: "buy_label", widget: "string", hint: "Defaults to 'Buy / Stream'", required: false }
      - { label: "Embed Player Snippet", name: "embed_snippet", widget: "markdown", required: false }
      - { label: "Description", name: "description", widget: "markdown" }
      - label: "Tracklist"
        name: "tracklist"
        widget: "list"
        required: false
        label_singular: "Track"
        summary: "{{fields.side}} {{fields.artist}} - {{fields.title}}"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Artist", name: "artist", widget: "string", required: false }
          - { label: "Duration", name: "duration", widget: "string", hint: "e.g. 5:42", required: false }
          - { label: "Side / Disc", name: "side", widget: "string", hint: "e.g. A, B, Disc 1 - leave blank for a single ungrouped list", required: false }
          - { label: "Audio Preview", name: "preview", widget: "file", required: false, media_folder: "/static/audio/previews", public_folder: "/audio/previews", hint: "Short MP3 clip (~30-60s, 128-192kbps). Anyone can download it, so upload a clip, not the full track." }
      - { label: "Tags", name: "tags", widget: "list", required: false }
  - name: "radio"
    label: "Radio"
    folder: "src/lib/_content/radio"
    create: true
    slug: "{{series}}-{{title}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Series / Episode", name: "series", widget: "string" }
      - { label: "Episode Date", name: "date", widget: "datetime" }
      - { label: "Episode Artwork", name: "episode_art", widget: "image" }
      - { label: "Listen Link", name: "listen_link", widget: "string" }
      - { label: "Embed Player Snippet", name: "embed_snippet", widget: "markdown", required: false }
      - { label: "Description", name: "description", widget: "markdown" }
      - { label: "Tags", name: "tags", widget: "list", required: false }
  - name: "events"
    label: "Events"
    folder: "src/lib/_content/events"
    create: true
    slug: "{{title}}-{{day}}-{{month}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Venue", name: "venue", widget: "string" }
      - { label: "City / Location", name: "location", widget: "string" }
      - { label: "Event Date", name: "date", widget: "datetime" }
      - { label: "Start Time", name: "start_time", widget: "string", hint: "e.g. 21:00", required: false }
      - { label: "End Time", name: "end_time", widget: "string", hint: "e.g. 03:00", required: false }
      - { label: "Event Artwork", name: "event_art", widget: "image" }
      - { label: "Ticket Link", name: "ticket_link", widget: "string", required: false }
      - { label: "Description", name: "description", widget: "markdown" }
      - { label: "Tags", name: "tags", widget: "list", required: false }
